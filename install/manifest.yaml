# fullstack-skills-kit v2 — manifest (SÓ FERRAMENTAS)
#
# As skills de PROCESSO são as fsk-* (global/ + skills/fsk-*), instaladas por `fsk.py core`.
# Este manifest lista apenas FERRAMENTAS por stack: MCPs e skills técnicas opcionais, que o
# `/fsk-setup` propõe quando a stack casa e instala só com "ok". MCP = caro; prefira CLI (núcleo).
#
# Campos: id, name, area, phase[] (fase fsk onde entra), type(skill|mcp|cli-skill|reference),
#   cost(low|high), scope(global|project), load(always|on-demand), required(bool),
#   telemetry(none|anonymous|operational), stack_match[], install, source, usage{when,avoid,pattern}, notes.
# stack_match: "*" = qualquer projeto web. trust_tiers: gate antes de instalar código de terceiros.

schema_version: 1
scope_focus: web-applications
out_of_scope:
- mobile
- native
- desktop
- ml-data-engineering
trust_tiers:
  official:
  - frontend-design
  - mcp-builder
  - context7
  - shadcn-skill
  - shadcn-mcp
  - figma-mcp
  - terraform-mcp
  - aws-mcp
  - azure-mcp
  - docker-mcp-gateway
  - grafana-mcp
  - sentry-mcp
  - datadog-mcp
  - cloudwatch-mcp
  - linear-mcp
  - atlassian-mcp
  - playwright-mcp
  - semgrep-mcp
  - infisical-secrets
  - web-design-guidelines
  - vercel-react-best-practices
  - chrome-devtools-mcp
  - k8s-mcp
  self:
  - nautilus
  - argonaut
  - docgen
  unverified:
  - db-migrations
  - better-design
  - material3-mcp
  - ui-ux-pro-max
areas:
- code-intelligence
- frontend-ui
- backend-api
- data-read
- data-migrations
- queues
- infra-devops
- secrets
- tasks
- observability
- qa-testing
- security
- documents
items:
- id: codegraph
  name: CodeGraph (MCP)
  area: code-intelligence
  phase: &id001
  - explore
  - build
  - review
  type: mcp
  cost: high
  scope: global
  load: on-demand
  required: false
  telemetry: none
  stack_match:
  - '*'
  source: https://github.com/suatkocar/codegraph
  install: codegraph init no projeto; MCP já disponível
  usage:
    when: entender fluxo/impacto/blast-radius que grep não segue (dispatch dinâmico)
    avoid: lookup de 1 símbolo que você já sabe onde está — use read/grep
    pattern: explore('símbolos ou pergunta') — 1 chamada, não loop
  notes: Genérico (qualquer código). Global permitido pelo usuário.
- id: context7
  name: Context7 (MCP)
  area: code-intelligence
  phase: *id001
  type: mcp
  cost: high
  scope: global
  load: on-demand
  required: false
  telemetry: none
  stack_match:
  - '*'
  source: https://github.com/upstash/context7
  install: claude mcp add context7 -- npx -y @upstash/context7-mcp
  usage:
    when: usar lib/framework cuja API pode ter mudado de versão
    avoid: libs triviais/estáveis que você já conhece
    pattern: resolve-library-id → query-docs com a versão do projeto
  notes: Genérico. Anti-alucinação de API. Global permitido pelo usuário.
- id: frontend-design
  name: frontend-design (Anthropic)
  area: frontend-ui
  phase: &id002
  - build
  - prove
  type: skill
  cost: low
  scope: project
  load: on-demand
