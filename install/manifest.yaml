  install: npx skills add https://github.com/anthropics/skills --skill frontend-design
  usage:
    when: direção estética — fugir da 'cara de IA'
    avoid: double-gate com ui-ux-pro-max no mesmo fluxo
    pattern: plano de tokens → revisar contra brief → codar
  notes: Opcional. ui-ux-pro-max cobre boa parte; usar como camada anti-AI-tell, não como 2º gate.
- id: ui-ux-pro-max
  name: ui-ux-pro-max (criar)
  area: frontend-ui
  phase: *id002
  type: skill
  cost: low
  scope: project
  load: on-demand
  required: false
  telemetry: none
  stack_match:
  - react
  - vue
  - svelte
  - angular
  - '*.tsx'
  - '*.jsx'
  source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
  install: /plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill && /plugin install ui-ux-pro-max@ui-ux-pro-max-skill
  usage:
    when: criar UI com estilo/paleta/tipografia/UX consistentes
    avoid: revisar — use web-design-guidelines
    pattern: integra com shadcn para busca de componentes
  notes: 'Principal da camada ''criar''. 50+ estilos, 161 paletas, 57 pares de fontes, 99 diretrizes UX.
    Scripts stdlib, sem rede. ATENÇÃO: contagem de estrelas suspeita (star-gaming) — não use como sinal
    de confiança; audite.'
