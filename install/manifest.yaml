# fullstack-engineer-curated-skills — manifest (fonte da verdade da curadoria)
#
# Princípio-mestre: skill = barato (lazy-load) · MCP = caro (4-32x mais tokens que CLI).
# A plataforma GLOBAL carrega só o barato + os 2 MCPs genéricos. Todo o resto é por-projeto,
# ligado pela skill `fullstack-setup` após detectar a stack e fazer um grill curto.
#
# Campos por item:
#   id, name, area, cycle[], type(skill|mcp|cli-skill|output-style|reference),
#   cost(low|high), scope(global|project), load(always|on-demand),
#   required(bool), telemetry(none|anonymous|operational), stack_match[], install, source,
#   usage{when, avoid, pattern}, notes
#
# stack_match: "*" = qualquer projeto. Senão: linguagens, arquivos-sinal ou vendors que a setup
# detecta/pergunta no grill (ex: "datadog" só é perguntado, nunca auto-instalado).

schema_version: 1

# ESCOPO (explícito): este kit foca APLICAÇÕES WEB — frontend web, backend/API, dados, filas, infra,
# observabilidade, segurança e QA de web. FORA DE ESCOPO por ora (declarado, não esquecido):
# mobile/native (React Native, Flutter, iOS/Android, Swift/Kotlin), desktop nativo, ML/data-eng.
scope_focus: web-applications
out_of_scope: [mobile, native, desktop, ml-data-engineering]

# CONFIANÇA (regra #4 do COMPOSITION): gate antes de instalar código de terceiros.
# Quem não está listado = 'community' (padrão: revisar). 'unverified' = AUDITAR ANTES de confiar.
# fsk.py usa isto no `plan`/`doctor`. Ao confirmar um link #VERIFY, mova o id de unverified → tier real.
trust_tiers:
  official:   # Anthropic ou vendor-oficial (link confirmado)
    [frontend-design, webapp-testing, mcp-builder, security-review-native, context7, shadcn-skill,
     shadcn-mcp, figma-mcp, terraform-mcp, aws-mcp, azure-mcp, docker-mcp-gateway, grafana-mcp,
     sentry-mcp, datadog-mcp, cloudwatch-mcp, linear-mcp, atlassian-mcp, playwright-mcp, semgrep-mcp,
     infisical-secrets, conventional-commit, web-design-guidelines, vercel-react-best-practices,
     chrome-devtools-mcp, k8s-mcp]
  self:       # autorado por este kit / dono do repo
    [using-mcps-well, documents, fullstack-setup, project-learning, project-onboarding, nautilus, argonaut]
  unverified: # baixa adoção ou sinal de confiança duvidoso — audite antes
    [db-migrations, better-design, material3-mcp, ui-ux-pro-max]

# Índice das áreas (o CATALOG.md é gerado/espelha isto)
areas:
  - discipline          # como o agente pensa/trabalha
  - flow                # spec/debug/review sob demanda
  - code-intelligence   # navegação de código + docs ao vivo
  - version-control     # git/PR
  - frontend-ui         # design, componentes, ícones, a11y, UX
  - backend-api
  - data-read
  - data-migrations
  - queues
  - infra-devops
  - secrets
  - tasks               # gestão de trabalho / tickets
  - observability
  - qa-testing
  - security
  - documents           # xlsx/pptx/pdf/docx
  - productivity
  - reference           # rules de arquitetura/boas práticas (conteúdo)

# =====================================================================================
# NÚCLEO GLOBAL — plataforma. Só barato + os 2 MCPs genéricos. Instalado uma vez em ~/.claude.
# =====================================================================================
items:
  - id: karpathy-ponytail
    name: Karpathy + Ponytail (disciplina)
    area: discipline
    cycle: [build, maintain]
    type: skill
    cost: low
    scope: global
    load: always
    required: true
    telemetry: none
    stack_match: ["*"]
    source: https://github.com/AbdullahHameedKhan/karpathy-ponytail-skills
    install: "curl -o ~/.claude/CLAUDE.snippets/karpathy-ponytail.md <raw-url> (ver install/README)"
    usage:
      when: "sempre on — pensar antes de codar, mudança cirúrgica, reusar antes de escrever"
      avoid: "nunca desligar; é a base anti-overengineering"
      pattern: "dono único do princípio YAGNI/KISS — nenhuma outra skill repete isso"
    notes: "Funde karpathy (raciocínio) + ponytail (laziness ladder). Fonte canônica de enxugamento."

  - id: using-mcps-well
    name: Using MCPs Well (nossa)
    area: discipline
    cycle: [build, operate]
    type: skill
    cost: low
    scope: global
    load: always
    required: true
    telemetry: none
    stack_match: ["*"]
    source: ./skills/using-mcps-well
    install: "incluída no repo"
    usage:
      when: "antes de ligar/chamar qualquer MCP"
      avoid: "chamar MCP quando read/grep/CLI resolve"
      pattern: "MCP é caro; read-only primeiro; batch/filtre; desligue o que não usa"
    notes: "Lê os blocos usage.* deste manifest para decidir quando cada MCP vale a pena."

  - id: conventional-commit
    name: Conventional Commit + git-commit (gh CLI)
    area: version-control
    cycle: [ship]
    type: cli-skill
    cost: low
    scope: global
    load: on-demand
    required: true
    telemetry: none
    stack_match: ["*"]
    source: https://github.com/github/awesome-copilot
    install: "npx skills add github/awesome-copilot (skills: git-commit, conventional-commit)"
    usage:
      when: "commit/PR do dia-a-dia"
      avoid: "GitHub MCP para isso — 4-32x mais tokens; use gh CLI"
      pattern: "diff → stage → Conventional Commit → gh pr create"
    notes: "GitHub MCP fica só para Actions/code-scanning/Projects."

  - id: security-review-native
    name: /security-review (nativo)
    area: security
    cycle: [review]
    type: skill
    cost: low
    scope: global
    load: on-demand
    required: true
    telemetry: none
    stack_match: ["*"]
    source: https://github.com/anthropics/claude-code-security-review
    install: "nativo do Claude Code"
    usage:
      when: "revisão rápida de segurança do diff antes de PR"
      avoid: "auditoria profunda — use cloudflare-security-audit"
      pattern: "rodar sobre o diff da branch"

  - id: documents
    name: Documents (router xlsx/pptx/pdf/docx) (nossa)
    area: documents
    cycle: [build]
    type: skill
    cost: low
    scope: global
    load: on-demand
    required: false
    telemetry: none
    stack_match: ["*"]
    source: ./skills/documents
    install: "incluída no repo; instala sob demanda a skill oficial do tipo pedido"
    usage:
      when: "criar/editar/ler .xlsx .pptx .pdf .docx"
      avoid: "carregar os 4 playbooks juntos"
      pattern: "detecta extensão → lê SÓ references/<tipo>.md → instala a skill oficial daquele tipo"
    notes: "Router com progressive disclosure. As 4 skills oficiais são PROPRIETARY — instalamos/apontamos, não copiamos."

  # --- as 3 skills originais que são o motor do repo ---
